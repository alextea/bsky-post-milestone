<script type="text/javascript">
(function() {
  var input = document.getElementById('input-handle');
  var list = document.getElementById('handle-suggestions');
  if (!input || !list) return;

  var form = input.form;
  var results = [];
  var activeIndex = -1;
  var debounceTimer = null;
  var controller = null;

  function open() {
    list.hidden = false;
    input.setAttribute('aria-expanded', 'true');
  }

  function close() {
    list.hidden = true;
    input.setAttribute('aria-expanded', 'false');
    input.removeAttribute('aria-activedescendant');
    activeIndex = -1;
  }

  function setActive(index) {
    var options = list.children;
    if (activeIndex >= 0 && options[activeIndex]) {
      options[activeIndex].classList.remove('active');
      options[activeIndex].setAttribute('aria-selected', 'false');
    }
    activeIndex = index;
    if (index >= 0 && options[index]) {
      options[index].classList.add('active');
      options[index].setAttribute('aria-selected', 'true');
      options[index].scrollIntoView({ block: 'nearest' });
      input.setAttribute('aria-activedescendant', options[index].id);
    } else {
      input.removeAttribute('aria-activedescendant');
    }
  }

  function select(index) {
    var actor = results[index];
    if (!actor) return;
    input.value = actor.handle;
    close();
    form.submit();
  }

  function render() {
    list.textContent = '';
    activeIndex = -1;

    if (!results.length) {
      close();
      return;
    }

    results.forEach(function(actor, i) {
      var li = document.createElement('li');
      li.id = 'handle-suggestion-' + i;
      li.setAttribute('role', 'option');
      li.setAttribute('aria-selected', 'false');

      var avatar = document.createElement(actor.avatar ? 'img' : 'span');
      avatar.className = 'suggestion-avatar';
      if (actor.avatar) {
        avatar.src = actor.avatar;
        avatar.alt = '';
      }

      var text = document.createElement('span');
      text.className = 'suggestion-text';

      var name = document.createElement('span');
      name.className = 'suggestion-name';
      name.textContent = actor.displayName || actor.handle;

      var handle = document.createElement('span');
      handle.className = 'suggestion-handle';
      handle.textContent = '@' + actor.handle;

      text.appendChild(name);
      text.appendChild(handle);
      li.appendChild(avatar);
      li.appendChild(text);

      // mousedown fires before the input blurs and closes the list
      li.addEventListener('mousedown', function(e) {
        e.preventDefault();
        select(i);
      });
      li.addEventListener('mousemove', function() {
        if (activeIndex !== i) setActive(i);
      });

      list.appendChild(li);
    });

    open();
  }

  function search(q) {
    if (controller) controller.abort();
    controller = new AbortController();

    fetch('/api/search?q=' + encodeURIComponent(q), { signal: controller.signal })
      .then(function(response) { return response.json(); })
      .then(function(actors) {
        results = Array.isArray(actors) ? actors : [];
        render();
      })
      .catch(function(err) {
        if (err.name !== 'AbortError') {
          results = [];
          render();
        }
      });
  }

  input.addEventListener('input', function() {
    clearTimeout(debounceTimer);
    var q = input.value.trim().replace(/^@/, '');

    if (q.length < 2) {
      if (controller) controller.abort();
      results = [];
      render();
      return;
    }

    debounceTimer = setTimeout(function() { search(q); }, 200);
  });

  input.addEventListener('keydown', function(e) {
    if (list.hidden) return;

    if (e.key === 'ArrowDown') {
      e.preventDefault();
      setActive((activeIndex + 1) % results.length);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      setActive(activeIndex <= 0 ? results.length - 1 : activeIndex - 1);
    } else if (e.key === 'Enter' && activeIndex >= 0) {
      e.preventDefault();
      select(activeIndex);
    } else if (e.key === 'Escape') {
      close();
    }
  });

  input.addEventListener('blur', close);
})();
</script>
